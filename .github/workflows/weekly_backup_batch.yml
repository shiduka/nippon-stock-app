name: Weekly Backup & Data Purge Batch

on:
  schedule:
    # 毎週日曜日の03:00 (JST) に実行 (UTCでは土曜18:00)
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  backup_and_purge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Parquet形式を扱うためのライブラリをインストール
          pip install pyarrow pandas
          
      - name: Run Backup & Purge script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # バッファリングを無効化してリアルタイムにログを表示
        run: python -u backup_and_purge.py
