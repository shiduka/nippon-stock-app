name: Daily Stock Price Batch

on:
  # 平日の日本時間18:00 (UTC 09:00) に自動実行
  schedule:
    - cron: '0 9 * * 1-5'
  
  # 手動でボタンを押して実行できるようにする設定
  workflow_dispatch:

jobs:
  run-batch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Fetch Stock Prices
        # GitHubのSecretsに登録した環境変数を利用して実行
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fetch_stock_prices.py
