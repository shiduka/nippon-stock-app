name: Monthly Benefits Batch

on:
  # 毎月15日の日本時間20:00 (UTC 11:00) に自動実行
  # ※優待情報は頻繁に変わらないため月1回で十分
  schedule:
    - cron: '0 11 15 * *'
  
  # 手動でボタンを押して実行できるようにする設定
  workflow_dispatch:

jobs:
  run-benefits-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Fetch Benefits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fetch_benefits.py
