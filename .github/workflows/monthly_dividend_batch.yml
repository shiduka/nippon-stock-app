name: Monthly Dividend Yield Batch

on:
  # 毎月1日の日本時間21:00 (UTC 12:00) に自動実衁E  # ※決算日バッチE20:00)の1時間後にずらして実衁E  schedule:
    - cron: '0 12 1 * *'
  
  # 手動でボタンを押して実行できるようにする設宁E  workflow_dispatch:

jobs:
  run-dividend-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Fetch Dividend Yields
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fetch_dividend_yields.py
