name: Weekly Margin Balance Batch

on:
  # 豈朱ｱ轣ｫ譖懊・譌･譛ｬ譎る俣21:00 (UTC 12:00) 縺ｫ閾ｪ蜍募ｮ溯｡・  # 窶ｻ菫｡逕ｨ谿九ョ繝ｼ繧ｿ縺ｯ驥第屆譌･譎らせ縺ｮ繝・・繧ｿ縺檎ｿ碁ｱ轣ｫ譖懈律縺ｫ蜈ｬ髢九＆繧後ｋ縺溘ａ
  schedule:
    - cron: '0 12 * * 2'
  
  # 謇句虚縺ｧ繝懊ち繝ｳ繧呈款縺励※螳溯｡後〒縺阪ｋ繧医≧縺ｫ縺吶ｋ險ｭ螳・  workflow_dispatch:

jobs:
  run-margin-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Fetch Margin Balance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fetch_margin_balance.py
