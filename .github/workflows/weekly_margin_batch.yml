name: Weekly Margin Balance Batch

on:
  # 毎週火曜の日本時間21:00 (UTC 12:00) に自動実行
  # ※信用残データは金曜日時点のデータが翌週火曜日に公開されるため
  schedule:
    - cron: '0 12 * * 2'
  
  # 手動でボタンを押して実行できるようにする設定
  workflow_dispatch:

jobs:
  run-margin-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium
          
      - name: Run Fetch Margin Balance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -u fetch_margin_balance.py
